name: Gource visualization

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gource Action
        uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257 # v1.3.0
        with:
          gource_resolution: 1080p
          gource_title: Chronicle
          gource_hide_items: mouse,date
          gource_font_size: 40
          gource_auto_skip_seconds: 0.5

      - name: Upload Gource video
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gource-visualization
          path: ./gource/gource.mp4
          retention-days: 30
