name: Gource visualization

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gource Action
        uses: nbprojekt/gource-action@v1.3.0
        with:
          gource_resolution: 1080p
          gource_title: Chronicle
          gource_hide_items: mouse,date
          gource_font_size: 40
          gource_auto_skip_seconds: 0.5

      - name: Upload Gource video
        uses: actions/upload-artifact@v4
        with:
          name: gource-visualization
          path: ./gource/gource.mp4
          retention-days: 30
